:root{

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1411; --panel:#14211b; --panel2:#1c2e25; --line:#2d4439;
  --ink:#e9f0e6; --mut:#97ac9f; --acc:#f2b84b; --onacc:#1b1405;
  --good:#62c783; --bad:#ea6a56; --blue:#5aaeff;

:root[data-theme="dark"]{
  --bg:#0b1411; --panel:#14211b; --panel2:#1c2e25; --line:#2d4439;
  --ink:#e9f0e6; --mut:#97ac9f; --acc:#f2b84b; --onacc:#1b1405;

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);

  padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:.02em}
h1{font-size:24px;color:var(--acc)} h2{font-size:18px} h3{font-size:13px;text-transform:uppercase;color:var(--mut)}
p{margin:0}
.mut{color:var(--mut)} .small{font-size:13px}
.stage{position:relative;width:100%;max-width:1040px;margin:0 auto;height:clamp(440px,calc(100vh - 96px),700px);height:clamp(440px,calc(100dvh - 96px),700px);
  border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--bg);touch-action:none;user-select:none;-webkit-user-select:none}

button.pri{background:var(--acc);color:var(--onacc);border-color:var(--acc);font-weight:700}
button.pri:hover:not(:disabled){filter:brightness(1.1)}
button[aria-pressed="true"]{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input[type=text]{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:9px 12px;min-height:42px;min-width:0;flex:1 1 160px}
.rk{display:grid;grid-template-columns:28px 30px minmax(0,1fr);gap:2px 10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.rk:first-child{border-top:0}
.rk .pos{font-family:var(--display);font-size:13px;color:var(--mut)}
.rk .nm{font-weight:700;overflow-wrap:anywhere}

.rk.me .nm{color:var(--acc)}
.chip{display:inline-block;font-family:var(--display);font-size:10px;padding:2px 6px;border-radius:3px;background:var(--tc,#888);color:#10170f;vertical-align:middle;letter-spacing:.03em}
.bar{height:8px;border-radius:2px;background:var(--panel2);overflow:hidden;border:1px solid var(--line)}

.pane.menu{margin:0;max-width:380px}
.pane .big{padding:13px 16px;font-size:17px}
.pane header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}

.roster-card{align-items:flex-start}
.roster-card button{margin-top:auto;width:100%}
.steps{font-family:var(--display);font-size:10px;color:var(--mut)}

.seg{display:flex;flex-wrap:wrap;gap:6px;grid-column:2/4}

.ach .medal{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-family:var(--display);font-size:13px;color:var(--mut)}

.up{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 0;border-top:1px solid var(--line)}
.slots{display:flex;gap:10px;flex-wrap:wrap}
.slot{width:92px;min-height:96px;border:2px dashed var(--line);border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--mut);text-align:center;padding:4px}
.slot.full{border-style:solid;border-color:var(--acc);color:var(--ink)}
.stat{width:100%;align-self:stretch;display:grid;grid-template-columns:62px minmax(0,1fr);gap:6px;align-items:center;font-size:12px;color:var(--mut)}
.lvl{font-family:var(--display);font-size:11px;color:var(--mut)}

#hud{position:absolute;inset:0;pointer-events:none;display:none}

#hud>*{pointer-events:auto}
#xpbar{position:absolute;left:0;right:0;top:0;height:18px;background:var(--hud);border-bottom:1px solid var(--line);pointer-events:none}

#xpbar span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:10px;color:var(--ink);text-shadow:0 0 3px var(--bg)}
.hl{position:absolute;left:10px;top:28px;display:flex;flex-direction:column;gap:6px;max-width:min(300px,62%);pointer-events:none}

.hpbox{background:var(--hud);border:1px solid var(--line);border-radius:5px;padding:6px 9px;display:flex;flex-direction:column;gap:4px}

.act{position:relative;overflow:hidden;width:82px;height:82px;border-radius:50%;text-align:center;padding:4px;display:grid;place-items:center;background:var(--hud);font-size:12px;line-height:1.15;border:2px solid var(--acc)}

.act.ready{box-shadow:0 0 0 3px rgba(242,184,75,.35)}
#joy{position:absolute;left:0;bottom:0;width:55%;height:65%;display:none;touch-action:none}
#joy.on{display:block}
#joy .base,#joy .knob{position:absolute;border-radius:50%;pointer-events:none;display:none}
#joy .base{width:110px;height:110px;border:2px solid var(--line);background:var(--hud);margin:-55px 0 0 -55px}
#joy .knob{width:50px;height:50px;background:var(--acc);opacity:.85;margin:-25px 0 0 -25px}

</style>

const lastSfx={};

function setMusic(m){mMode=m;}
function musicTick(){
  if(!AC)return;
  if(S.music<=0){mNext=AC.currentTime+.1;return;}
  mNext=Math.max(mNext,AC.currentTime-.05);
  while(mNext<AC.currentTime+.35){playStep(mStep,mNext);mNext+=60/(mMode==='boss'?138:mMode==='play'?112:84)/2;mStep++;}
}
function playStep(i,t){
  const s=i%16,bar=Math.floor(i/16)%4,roots=[110,87.3,98,82.4],root=roots[bar];
  const sc=[1,1.2,1.5,1.8,2,2.4,3];
  if(s%4===0)tone(root,t,.4,'triangle',.55,musG);
  if(mMode==='menu'){if(s%4===2)tone(root*2*sc[(s+bar*2)%7],t,.5,'sine',.22,musG);}
  else{
    if(s%2===0)tone(root*2*sc[(s*3+bar*2)%7],t,.16,'square',.1,musG);

function update(dt){
  const p=run.pl,st=run.st;run.time+=dt;timeNow+=dt;p.t+=dt;
  if(run.fade>0)run.fade=Math.max(0,run.fade-dt*2.2);
  if(run.over){run.overT-=dt;if(run.overT<=0)endRun();updFx(dt);return;}
  p.inv=Math.max(0,p.inv-dt);p.flash=Math.max(0,p.flash-dt);p.cast=Math.max(0,(p.cast||0)-dt);p.swing=Math.max(0,(p.swing||0)-dt);run.ber=Math.max(0,(run.ber||0)-dt);run.sp=Math.max(0,run.sp-dt);
  p.hp=Math.min(st.maxhp,p.hp+st.regen*dt);
  // movimento
  let mx=(keys.r?1:0)-(keys.l?1:0),my=(keys.d?1:0)-(keys.u?1:0);
  if(joyV.x||joyV.y){mx=joyV.x;my=joyV.y;}
  const ml=Math.hypot(mx,my);if(ml>1){mx/=ml;my/=ml;}
  if(p.dash){
    const D=p.dash;D.t-=dt;p.x+=D.dx*(D.spd||1500)*dt;p.y+=D.dy*(D.spd||1500)*dt;p.vx=D.dx*400;p.vy=D.dy*400;
    if(D.fire){const fc=['#ffd36b','#ff8a3d','#ff4a1c'];for(let k=0;k<2;k++)parts.push({x:p.x+rf(-8,8),y:p.y+rf(-14,10),vx:rf(-40,40),vy:rf(-70,-10),life:.45,max:.45,c:pick(fc),r:rf(6,11)});}
    else parts.push({x:p.x,y:p.y,vx:0,vy:0,life:.3,max:.3,c:'#ffd23f',r:7});
    enemies.slice().forEach(e=>{if(e.spawn>0||D.hit.has(e))return;if(dist(e,p)<e.r+30){D.hit.add(e);hitEnemy(e,st.dmg*(D.dm||2),D.fire?{burn:true,bm:2.2,stun:.2,c:'#ff8a3d'}:{c:'#ffd23f',stun:.3});}});
    if(p.dash.t<=0)p.dash=null;
  }else{
    const sp=st.spd;
    p.vx+=(mx*sp-p.vx)*Math.min(1,dt*14);p.vy+=(my*sp-p.vy)*Math.min(1,dt*14);
    p.x+=p.vx*dt;p.y+=p.vy*dt;
  }
  if(Math.abs(mx)>.1)p.face=mx>0?1:-1;
  // ataque principal
  run.cd-=dt;
  const manual=!touchOn()&&S.aim!=='auto',a=aimInfo();
  let fire=false,ang=a.ang,tx=a.wx,ty=a.wy;
  if(manual){
    if(Math.abs(a.wx-p.x)>8)p.face=a.wx>p.x?1:-1;
    fire=S.aim==='manual'?mouse.down:!!nearest(p,enemies,700);
  }else{
    const t=nearest(p,enemies,520);
    if(t){ang=Math.atan2(t.y-p.y,t.x-p.x);tx=t.x;ty=t.y;fire=true;if(Math.abs(t.x-p.x)>10)p.face=t.x>p.x?1:-1;}
  }
  if(run.ber>0&&!fire){const t=nearest(p,enemies,430);if(t){ang=Math.atan2(t.y-p.y,t.x-p.x);tx=t.x;ty=t.y;fire=true;}}
  if(run.ber>0&&Math.random()<.7)parts.push({x:p.x+rf(-16,16),y:p.y+rf(-26,10),vx:rf(-30,30),vy:rf(-100,-40),life:.5,max:.5,c:pick(['#ff4a1c','#ff8a3d','#ffd36b']),r:rf(5,9)});
  if(fire&&run.cd<=0&&!(p.dash&&run.ch==='fogo'))basicAttack(ang,tx,ty);
  updAllies(dt);updHeal(dt);
  spawnTick(dt);
  updEnemies(dt);
  if(run.over){updFx(dt);return;}
  updProj(dt);
  if(run.over){updFx(dt);return;}
  updLobs(dt);updPools(dt);
  updPick(dt);
  updFx(dt);
  // câmera
  const vw=CW/zoom,vh=CH_/zoom;
  cam.x+=(p.x-vw/2-cam.x)*Math.min(1,dt*9);cam.y+=(p.y-vh/2-cam.y)*Math.min(1,dt*9);
  if(shake>0)shake=Math.max(0,shake-dt*30);
  // nível
  let lvUp=false;
  while(run.xp>=run.need){run.xp-=run.need;run.lv++;run.need=xpNeed(run.lv);run.pend++;lvUp=true;onLevel();}
  if(lvUp)sfx('level');
  achT+=dt;if(achT>1){achT=0;checkAch();}
  if(run.pend>0&&!uiOpen)showLevelUp();
}

function updEnemies(dt){
  const p=run.pl,far=Math.hypot(CW,CH_)/zoom/2+420;
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];if(!e)continue;
    e.t+=dt;e.flash=Math.max(0,e.flash-dt);e.hit=Math.max(0,e.hit-dt);e.leafCd=Math.max(0,e.leafCd-dt);
    if(e.spawn>0){e.spawn-=dt;continue;}
    if(e.burn>0){e.burn-=dt;e.bt2+=dt;if(e.bt2>=.5){e.bt2=0;e.hp-=e.burnD*.5;e.flash=.05;if(e.hp<=0){killEnemy(e);continue;}}}
    e.slow=Math.max(0,e.slow-dt);e.root=Math.max(0,e.root-dt);e.stun=Math.max(0,e.stun-dt);
    const dx=p.x-e.x,dy=p.y-e.y,d=Math.hypot(dx,dy)||1,ux=dx/d,uy=dy/d;
    if(!e.boss&&d>far){const np=spawnPos();e.x=np.x;e.y=np.y;continue;}
    let sp=e.spd*(e.slow>0?.55:1)*(e.root>0||e.stun>0?0:1),mvx=0,mvy=0;
    e.face=ux>=0?1:-1;
    if(e.stun<=0){
      switch(e.kind){
        case 'chase':mvx=ux*sp;mvy=uy*sp;break;
        case 'shoot':{
          if(d>320){mvx=ux*sp;mvy=uy*sp;}else if(d<200){mvx=-ux*sp;mvy=-uy*sp;}else{mvx=-uy*sp*.6;mvy=ux*sp*.6;}
          e.cd-=dt;
          if(e.cd<=0&&d<500){e.cd=e.type==='fogo'?2.4:2.8;const s2=e.type==='fogo'?220:250;ebul.push({x:e.x,y:e.y,vx:ux*s2,vy:uy*s2,dmg:e.dmg*.8,r:8,life:3.5,c:TI[e.type].c});}
          break;}
        case 'blink':{
          mvx=ux*sp;mvy=uy*sp;e.bt-=dt;
          if(e.bt<=0&&d>220){e.bt=rf(2.6,4);burst(e.x,e.y,'#a58bff',8,150,.35);const an=rf(0,TAU);e.x=p.x+Math.cos(an)*160;e.y=p.y+Math.sin(an)*160;burst(e.x,e.y,'#a58bff',8,150,.35);}
          break;}
        case 'boss':updBoss(e,dt,ux,uy,d,sp);mvx=e.mvx;mvy=e.mvy;break;
      }
    }
    e.x+=(mvx+e.kx)*dt;e.y+=(mvy+e.ky)*dt;
    const kd=Math.max(0,1-dt*6);e.kx*=kd;e.ky*=kd;
    if(e.stun<=0&&d<e.r+p.r-4&&e.hit<=0){e.hit=.6;hurtPlayer(e.dmg*(e.boss?1.2:1),e);}
  }
  if(enemies.length<=300){
    for(let i=0;i<enemies.length;i++){
      const a=enemies[i];if(a.spawn>0)continue;
      for(let j=i+1;j<enemies.length;j++){
        const b=enemies[j];if(b.spawn>0)continue;
        const dx=b.x-a.x;if(dx>40||dx<-40)continue;const dy=b.y-a.y;if(dy>40||dy<-40)continue;
        const d=Math.hypot(dx,dy),m=(a.r+b.r)*.85;
        if(d<m&&d>.01){const k=(m-d)/2/d*.8;a.x-=dx*k;a.y-=dy*k;b.x+=dx*k;b.y+=dy*k;}
      }
    }
  }
}

function updProj(dt){

function ownedPs(){return PS.filter(p=>run.pk[p.id]>0).length;}
function makeCards(){
  const pool=[];

  PS.forEach(p=>{const n=run.pk[p.id];if(n>0){if(n<p.max)pool.push({k:'ps',id:p.id,w:4});}else if(ownedPs()<MAXPS)pool.push({k:'ps',id:p.id,w:3});});
  if(run.bl<5)pool.push({k:'basic',w:4});
  if(!pool.length){pool.push({k:'heal',w:1});pool.push({k:'ess',w:1});}
  const bag=[];pool.forEach(c=>{for(let i=0;i<c.w;i++)bag.push(c);});
  const out=[];let g=0;while(out.length<Math.min(3,pool.length)&&g++<300){const c=pick(bag);if(!out.includes(c))out.push(c);}
  return out;
}

function checkAch(){
  let ch=false;
  ACH.forEach(a=>{if(!P.ach[a.id]&&a.t()){P.ach[a.id]=1;ch=true;toast('Conquista: '+a.n);sfx('ach');}});

}

/* ================= fim de jornada ================= */
function endRun(){
  if(run.ended)return;run.ended=true;
  const m=Math.floor(run.time/60),sec=Math.floor(run.time%60);
  const ess=Math.round(run.lv*6+run.kills*.15+(run.time/60)*8+run.bossKills*40);
  P.ess+=ess;P.st.runs++;P.st.bestTime=Math.max(P.st.bestTime,run.time);P.st.bestLv=Math.max(P.st.bestLv,run.lv);
  const rec=addLocalRank();
  checkAch();save();
  mode='menu';uiOpen=true;hud.classList.remove('on');setMusic('menu');
  const al=run.allies.map(a=>NM[a.type][a.lvl>=3?1:0]+' Nv '+a.lvl).join(', ')||'nenhum';
  setUI('over',`<div class="pane menu"><h2>A névoa venceu desta vez</h2>
  <p>${NM[run.ch][run.stage>1?1:0]} caiu no nível ${run.lv}.</p>
  <div class="card small"><span>Tempo: <b>${m}:${String(sec).padStart(2,'0')}</b></span><span>Monstros derrotados: <b>${run.kills}</b></span><span>Chefes derrotados: <b>${run.bossKills}</b></span><span>Aliados: ${al}</span><span>Essência ganha: <b style="color:var(--acc)">+${ess}</b></span><span id="rank-st" class="mut"></span></div>

}

/* ================= ranking ================= */
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const scoreOf=(lv,time)=>lv*100000+Math.min(99999,Math.floor(time));
const fmtT=t=>Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0');
async function initDb(){
  try{
    if(!window.claude||!window.claude.use)return;
    const r=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!r[0])return;
    DBH=r[0];
    if(r[1]){UID=await r[1].id();CANW=await r[1].can('data.write');ISOWN=await r[1].isOwner();}
  }catch(e){DBH=null;}
}
function addLocalRank(){
  const rec={ch:run.ch,lv:run.lv,time:Math.floor(run.time),kills:run.kills,score:scoreOf(run.lv,run.time),at:Date.now()};
  P.rank.push(rec);P.rank.sort((a,b)=>b.score-a.score);P.rank=P.rank.slice(0,10);return rec;
}
async function submitRank(rec){
  if(!rec)return 'Termine uma jornada primeiro.';
  if(!P.nick)return 'Defina um apelido em Ranking para enviar sua pontuação.';
  if(!DBH)return 'O ranking online não está disponível aqui. Seu recorde ficou salvo neste navegador.';
  if(!UID)return 'Entre na sua conta para aparecer no ranking.';
  if(CANW===false)return 'Seu acesso é só de leitura, então a pontuação não foi enviada.';
  try{
    const ref=DBH.doc('rank/'+UID),cur=await ref.get();
    if(cur.exists&&(cur.data().score||0)>=rec.score)return 'Sua melhor marca no ranking continua maior que esta.';
    await ref.set({nick:P.nick,ch:rec.ch,lv:rec.lv,time:rec.time,kills:rec.kills,score:rec.score,at:rec.at});
    return 'Pontuação enviada ao ranking!';
  }catch(e){return 'Não foi possível enviar agora ('+(e&&e.code?e.code:'erro')+').';}
}
function rowHTML(id,d,i){
  const ch=CH[d.ch]?d.ch:'fogo',me=id&&UID&&id===UID;
  return `<div class="rk${me?' me':''}"><span class="pos">${i+1}</span>${ico(ch,1,'sm')}<span class="nm">${esc(d.nick||'Jogador')}${me?' (você)':''}</span><span class="small mut info">Nível ${Number(d.lv)||0} · ${fmtT(Number(d.time)||0)} · ${Number(d.kills)||0} abates</span>${ISOWN&&id&&!me?`<button data-a="rmrank" data-i="${esc(id)}">Remover</button>`:''}</div>`;
}

  let note='';

  else if(!UID)note='Você não está identificado, então só pode ver o ranking.';
  else if(CANW===false)note='Seu acesso é de leitura: você vê o ranking, mas não envia pontuação. Peça acesso de Colaborador a quem compartilhou o jogo.';
  return `<div class="pane"><header><h2>Ranking</h2><button data-a="menu">Voltar</button></header>
  <div class="card"><label for="nick" class="lab">Seu apelido</label><div class="row"><input type="text" id="nick" maxlength="16" value="${esc(P.nick)}" placeholder="Até 16 caracteres"><button data-a="savenick">Salvar</button></div><p class="small mut" id="nick-st">${esc(note)}</p></div>
  <div class="row"><button data-a="rtab" data-i="global" aria-pressed="${rankTab==='global'}">Global</button><button data-a="rtab" data-i="local" aria-pressed="${rankTab==='local'}">Meus recordes</button></div>

}
/* cenário do menu */
function initMenuMons(){
  menuMons=TYPES.map((t,i)=>({type:t,stage:i%3===2?2:1,x:900+i*70,y:300+((i*131)%260),face:i%2?1:-1,t:rf(0,6),vx:rf(-30,30),vy:rf(-14,14),tm:rf(1,3)}));
}
function ambientUpdate(dt){
  if(!menuMons.length)initMenuMons();
  timeNow+=dt;menuCam.x=520+Math.sin(timeNow*.08)*90;menuCam.y=140+Math.cos(timeNow*.06)*40;
  menuMons.forEach(m=>{m.t+=dt;m.tm-=dt;if(m.tm<=0){m.tm=rf(1.5,3.5);m.vx=rf(-60,60);m.vy=rf(-30,30);if(Math.abs(m.vx)>5)m.face=m.vx>0?1:-1;}
    m.x=clamp(m.x+m.vx*dt,700,1500);m.y=clamp(m.y+m.vy*dt,200,640);});
}
function drawMenuFx(dark){
  ctx.fillStyle=dark?'rgba(255,230,150,.8)':'rgba(255,255,255,.9)';
  for(let i=0;i<22;i++){
    const x=cam.x+((i*97+timeNow*8*(1+i%3))%(CW/zoom)),y=cam.y+((i*61+Math.sin(timeNow+i)*30+220)%(CH_/zoom));
    ctx.globalAlpha=.4+.4*Math.sin(timeNow*2+i);ctx.fillRect(x,y,3,3);
  }
  ctx.globalAlpha=1;
}

/* ================= laço principal ================= */
let last=0;
function frame(ts){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(ts-last)/1000||0);last=ts;
  try{
    cv.style.cursor=(mode==='play'&&!uiOpen&&S.aim!=='auto'&&!touchOn())?'none':'default';
    if(mode==='play'&&run&&!uiOpen)update(dt);

    render();
    hudT+=dt;if(hudT>.1){hudT=0;updHud();}
  }catch(err){console.error(err);}
}
