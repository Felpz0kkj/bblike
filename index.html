:root{

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1411; --panel:#14211b; --panel2:#1c2e25; --line:#2d4439;
  --ink:#e9f0e6; --mut:#97ac9f; --acc:#f2b84b; --onacc:#1b1405;
  --good:#62c783; --bad:#ea6a56; --blue:#5aaeff;

:root[data-theme="dark"]{

  --ink:#e9f0e6; --mut:#97ac9f; --acc:#f2b84b; --onacc:#1b1405;
  --good:#62c783; --bad:#ea6a56; --blue:#5aaeff;

body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);
  padding-block:10px 28px;

  padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:.02em}
h1{font-size:24px;color:var(--acc)} h2{font-size:18px} h3{font-size:13px;text-transform:uppercase;color:var(--mut)}
p{margin:0}
.mut{color:var(--mut)} .small{font-size:13px}
.stage{position:relative;width:100%;max-width:1040px;margin:0 auto;height:clamp(440px,calc(100vh - 96px),700px);height:clamp(440px,calc(100dvh - 96px),700px);
  border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--bg);touch-action:none;user-select:none;-webkit-user-select:none}

.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.stat{width:100%;align-self:stretch;display:grid;grid-template-columns:62px minmax(0,1fr);gap:6px;align-items:center;font-size:12px;color:var(--mut)}
.lvl{font-family:var(--display);font-size:11px;color:var(--mut)}

#hud{position:absolute;inset:0;pointer-events:none;display:none}

#hud>*{pointer-events:auto}

.hl{position:absolute;left:10px;top:28px;display:flex;flex-direction:column;gap:6px;max-width:min(300px,62%);pointer-events:none}
.hl>*{pointer-events:none}
.hpbox{background:var(--hud);border:1px solid var(--line);border-radius:5px;padding:6px 9px;display:flex;flex-direction:column;gap:4px}
.hpbar{position:relative;height:14px;border-radius:3px;background:var(--panel2);overflow:hidden;border:1px solid var(--line)}
.hpbar i{position:absolute;inset:0 auto 0 0;background:var(--good);width:100%}

.player-hp span{left:17px;color:#fff4e4;text-shadow:1px 1px #100e10,-1px -1px #100e10,1px -1px #100e10,-1px 1px #100e10;font-size:10px}

.hpmeta{font-size:12px;color:var(--mut);display:flex;gap:10px;flex-wrap:wrap;font-variant-numeric:tabular-nums}

.pchip{background:var(--hud);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:11px;color:var(--mut)}

</style>

function recompute(){
  const r=run,c=CH[r.ch],pk=r.pk,p=r.pl,sm=[1,1.25,1.6][r.stage-1],old=r.st?r.st.maxhp:null,st={};
  st.maxhp=Math.round((c.hp+20*pk.hp+10*P.up.vida+r.bonusHp)*sm);
  st.dmgm=(1+.10*pk.dmg+.05*P.up.forca)*sm;
  st.dmg=c.dmg*st.dmgm*(1+.25*(r.bl-1));
  st.spd=c.spd*(1+.07*pk.spd);
  st.cdm=1/(1+.08*pk.cd);
  st.area=1+.10*pk.area+c.area;
  st.magnet=110*(1+.30*pk.magnet+.10*P.up.ima);
  st.armor=Math.min(.7,.06*pk.armor+c.armor);
  st.regen=.5*pk.regen+c.regen;
  st.crit=.05+.05*pk.crit+(c.crit-.05);
  st.life=c.life;
  st.xpm=1+.08*pk.xp+.05*P.up.xp;
  st.multi=1+pk.multi;
  r.st=st;
  if(old!==null)p.hp=Math.min(st.maxhp,p.hp+Math.max(0,st.maxhp-old));
}

function spawnPos(rad){const a=rf(0,TAU),p=run.pl,r=rad||(Math.hypot(CW,CH_)/zoom/2+70);return{x:p.x+Math.cos(a)*r,y:p.y+Math.sin(a)*r};}
function pickType(L){

function spawnBoss(L=run.lv){

/* ================= combate ================= */
function nearest(from,list,maxd,filt){
  let best=null,bd=maxd;
  for(const e of list){if(e.spawn>0||e.hp<=0)continue;if(filt&&!filt(e))continue;const d=Math.hypot(e.x-from.x,e.y-from.y)-e.r;if(d<bd){bd=d;best=e;}}
  return best;
}
function burst(x,y,c,n,sp,life){if(parts.length>400)return;for(let i=0;i<n;i++){const a=rf(0,TAU),s=rf(sp*.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rf(life*.5,life),max:life,c,r:rf(2,4.5)});}}
function floater(x,y,txt,c,big){if(!S.dmgnum&&typeof txt==='number')return;if(floats.length>60)return;floats.push({x,y,txt,c,life:.7,big});}
function shk(v){if(S.shake)shake=Math.max(shake,v);}
function hitEnemy(e,dmg,o){
  o=o||{};if(run.over||e.hp<=0||e.spawn>0)return;
  let crit=false;
  if(o.canCrit!==false&&Math.random()<run.st.crit){dmg*=2;crit=true;}
  dmg=Math.max(1,Math.round(dmg));
  const dealt=Math.min(e.hp,dmg);e.hp-=dmg;e.flash=.1;
  floater(e.x,e.y-e.r,dmg,crit?'#ffd23f':'#ffffff',crit);
  if(run.st.life>0)run.pl.hp=Math.min(run.st.maxhp,run.pl.hp+dealt*run.st.life);
  if(o.slow)e.slow=Math.max(e.slow,1.6);
  if(o.burn){e.burn=3;e.burnD=Math.max(e.burnD,dmg*.25*(o.bm||1));}
  if(o.stun)e.stun=Math.max(e.stun,e.boss&&!o.fullStun?Math.min(.3,o.stun):o.stun);
  if((o.kx||o.ky)&&!(e.boss)){const k=e.elite?.5:1;e.kx+=(o.kx||0)*k;e.ky+=(o.ky||0)*k;}
  if(o.root)e.root=Math.max(e.root,e.boss?.5:o.root);
  if(o.c)burst(e.x,e.y,o.c,2,110,.25);
  sfx('hit');

}
function dropGem(x,y,v){

function killEnemy(e,silent){

    enemies.slice().forEach(o=>{if(o!==e&&o.spawn<=0&&dist(o,e)<80+o.r)hitEnemy(o,run.st.dmg*.5,{burn:true,canCrit:false,c:'#ff8a3d'});});

  }

}
function hurtPlayer(d,from,opts){

  if(from&&CH[run.ch].armor<.2){const a=Math.atan2(p.y-from.y,p.x-from.x);p.vx+=Math.cos(a)*180;p.vy+=Math.sin(a)*180;}

      fx.push({k:'ring',x:p.x,y:p.y,r:0,mx:320,life:.6,max:.6,c:'#ffd23f'});

function applyRot(duration=5,message='Podridão! Afaste-se do sopro.'){

function pushProj(o){pbul.push(Object.assign({hit:new Set(),pierce:0,life:1,r:9,from:'p'},o));}
function chainLightning(origin,first,damage){
  if(!first||first.hp<=0||first.spawn>0)return [];
  const live=enemies.filter(e=>e.hp>0&&e.spawn<=0),targets=[first];
  while(targets.length<BAL.chainFalloff.length){
    const last=targets[targets.length-1],next=nearest(last,live,BAL.chainJump,e=>!targets.includes(e)&&dist(last,e)<=BAL.chainJump);
    if(!next)break;targets.push(next);
  }
  // Um crítico é compartilhado por toda a cadeia, preservando a queda de dano.
  const power=damage*(Math.random()<run.st.crit?2:1);let from=origin;
  targets.forEach((e,i)=>{fx.push({k:'cbolt',x1:from.x,y1:from.y,x2:e.x,y2:e.y,life:.18,max:.18});hitEnemy(e,power*BAL.chainFalloff[i],{canCrit:false,stun:Math.random()<BAL.chainStunChance?BAL.chainStun:0,c:BC[run.stage-1][0]});from=e;});
  return targets;
}

      const fs=pickFish();lobs.push({kind:'drop',x0:p.x,y0:p.y,tx:ex,ty:ey,t:-.14,dur:.4+d/1500,dmg:dmg*2.3*fs.dm,r:84*A*fs.rm,c:'#5aaeff',sp:fs});

function update(dt){
  const p=run.pl,st=run.st;timeNow+=dt;p.t+=dt;
  if(run.fade>0)run.fade=Math.max(0,run.fade-dt*2.2);
  if(run.over){run.overT-=dt;p.flash=Math.max(0,p.flash-dt);const elapsed=run.overMax-run.overT;updFx(dt*(elapsed<1.6?.3:.6));if(run.overT<=0||(run.skip&&elapsed>1.8))endRun();return;}
  run.time+=dt;
  p.inv=Math.max(0,p.inv-dt);p.flash=Math.max(0,p.flash-dt);p.cast=Math.max(0,(p.cast||0)-dt);p.swing=Math.max(0,(p.swing||0)-dt);p.cast2=Math.max(0,(p.cast2||0)-dt);run.ber=Math.max(0,(run.ber||0)-dt);run.sp=Math.max(0,run.sp-dt);run.dcd=Math.max(0,(run.dcd||0)-dt);

  p.hp=Math.min(st.maxhp,p.hp+st.regen*dt);
  tickRot(dt);if(run.over){updFx(dt);return;}
  // movimento
  let mx=(keys.r?1:0)-(keys.l?1:0),my=(keys.d?1:0)-(keys.u?1:0);
  if(joyV.x||joyV.y){mx=joyV.x;my=joyV.y;}
  const ml=Math.hypot(mx,my);if(ml>1){mx/=ml;my/=ml;}
  if(p.dash){
    const D=p.dash,step=Math.min(dt,D.t);D.t-=step;p.x+=D.dx*(D.spd||1500)*step;p.y+=D.dy*(D.spd||1500)*step;p.vx=D.dx*400;p.vy=D.dy*400;
    if(D.fire){const fc=['#ffd36b','#ff8a3d','#ff4a1c'];for(let k=0;k<2;k++)parts.push({x:p.x+rf(-8,8),y:p.y+rf(-14,10),vx:rf(-40,40),vy:rf(-70,-10),life:.45,max:.45,c:pick(fc),r:rf(6,11)});}
    else if(D.nodmg)parts.push({x:p.x,y:p.y,vx:0,vy:0,life:.3,max:.3,c:TI[run.ch].c,r:5});
    else parts.push({x:p.x,y:p.y,vx:0,vy:0,life:.3,max:.3,c:'#ffd23f',r:7});
    enemies.slice().forEach(e=>{if(e.spawn>0||D.hit.has(e)||D.nodmg)return;if(dist(e,p)<e.r+30){D.hit.add(e);hitEnemy(e,st.dmg*(D.dm||2),D.fire?{burn:true,stun:.2,c:'#ff8a3d'}:{c:'#ffd23f',stun:.3});}});
    if(p.dash.t<=0)p.dash=null;
  }else{

    p.vx+=(mx*sp-p.vx)*Math.min(1,dt*14);p.vy+=(my*sp-p.vy)*Math.min(1,dt*14);
    p.x+=p.vx*dt;p.y+=p.vy*dt;
  }
  if(Math.abs(mx)>.1)p.face=mx>0?1:-1;
  const motion=clamp(Math.hypot(p.vx,p.vy)/Math.max(1,st.spd),0,1);p.mvs=(p.mvs||0)+(motion-(p.mvs||0))*Math.min(1,dt*10);
  {const mv=Math.hypot(p.vx,p.vy)>40;
    p.aura=(p.aura||0)-dt;if(run.stage>=2&&p.aura<=0&&parts.length<400){p.aura=run.stage>=3?.06:.12;auraPart(p);}
    p.dust=(p.dust||0)-dt;if(mv&&!p.dash&&p.dust<=0&&parts.length<400){p.dust=.16;parts.push({x:p.x,y:p.y+24,vx:rf(-20,20),vy:-20,life:.35,max:.35,c:'rgba(214,200,160,.6)',r:5});}
    run.flash=Math.max(0,(run.flash||0)-dt*1.3);
  }
  if(!bossAlive()&&run.bossQueue.length)spawnBoss(run.bossQueue.shift());
  // ataque principal
  run.cd-=dt;
  if(run.chg)chargeTick(dt);
  const manual=!touchOn()&&S.aim!=='auto',a=aimInfo();

    if(Math.abs(a.wx-p.x)>8)p.face=a.wx>p.x?1:-1;

  if(fire&&run.cd<=0&&!run.chg&&!(p.dash&&run.ch==='fogo'))basicAttack(ang,tx,ty);
  updAllies(dt);updHeal(dt);
  spawnTick(dt);
  updEnemies(dt);
  if(run.over){updFx(dt);return;}
  updProj(dt);
  if(run.over){updFx(dt);return;}
  updLobs(dt);updPools(dt);
  updPick(dt);
  updFx(dt);

  if(shake>0)shake=Math.max(0,shake-dt*30);

  let lvUp=false;
  while(run.xp>=run.need){run.xp-=run.need;run.lv++;run.need=xpNeed(run.lv);run.pend++;lvUp=true;onLevel();}
  if(lvUp){sfx('level');levelFx();}
  achT+=dt;if(achT>1){achT=0;checkAch();}
  if(run.pend>0&&!uiOpen)showLevelUp();
}
function onLevel(){

    if(b.homing){b.hd-=dt;if(b.hd<=0){const e=nearest(b,enemies,BAL.shadowSeek);if(e){const a=Math.atan2(e.y-b.y,e.x-b.x),cur=Math.atan2(b.vy,b.vx);let da=a-cur;while(da>Math.PI)da-=TAU;while(da<-Math.PI)da+=TAU;const na=cur+clamp(da,-6*dt,6*dt),speed=Math.hypot(b.vx,b.vy);b.vx=Math.cos(na)*speed;b.vy=Math.sin(na)*speed;b.ang=na;}}}
    const speed=Math.hypot(b.vx,b.vy),step=Math.min(Math.max(0,b.life),dt,Number.isFinite(b.range)?Math.max(0,b.range)/(speed||1):dt);
    b.x+=b.vx*step;b.y+=b.vy*step;b.life-=dt;
    if(Number.isFinite(b.range))b.range=Math.max(0,b.range-speed*step);
    const sx=b.x-oldX,sy=b.y-oldY,len2=sx*sx+sy*sy,candidates=[];
    if(step>0)for(const e of enemies.slice()){
      if(e.hp<=0||e.spawn>0||b.hit.has(e))continue;
      const ex=e.x-oldX,ey=e.y-oldY,rr=e.r+b.r;
      let t=0;
      if(ex*ex+ey*ey>rr*rr){
        if(!len2)continue;
        const dot=ex*sx+ey*sy,disc=dot*dot-len2*(ex*ex+ey*ey-rr*rr);
        if(disc<0)continue;t=(dot-Math.sqrt(disc))/len2;if(t<0||t>1)continue;
      }
      candidates.push({e,t});
    }
    candidates.sort((a,b)=>a.t-b.t);
    for(const {e} of candidates){
      if(e.hp<=0)continue;b.hit.add(e);
      hitEnemy(e,b.dmg,{slow:b.slow,burn:b.burn,kx:b.vx/(speed||1)*90,ky:b.vy/(speed||1)*90,c:TI[b.type].c});
      if(b.pierce>0){b.pierce--;b.dmg*=b.falloff??1;}else{b.life=0;break;}
    }
    if(b.range===0)b.life=0;
    if(b.life<=0)pbul.splice(i,1);
  }
  const p=run.pl;
  for(let i=ebul.length-1;i>=0;i--){
    const b=ebul[i];if(!b)continue;b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
    if(b.life>0&&Math.hypot(p.x-b.x,p.y-b.y)<p.r+b.r-2){hurtPlayer(b.dmg);b.life=0;}
    if(b.life<=0)ebul.splice(i,1);
  }
  for(let i=hazards.length-1;i>=0;i--){
    const h=hazards[i];h.t-=dt;
    if(h.t<=0){if(Math.hypot(p.x-h.x,p.y-h.y)<h.r+p.r*.5)hurtPlayer(h.dmg);burst(h.x,h.y,'#c9a97f',12,220,.45);shk(3);hazards.splice(i,1);}
  }
}
function updLobs(dt){

function updPools(dt){

      enemies.slice().forEach(e=>{if(e.spawn<=0&&Math.hypot(e.x-o.x,e.y-o.y)<o.r+e.r){const a=Math.atan2(e.y-o.y,e.x-o.x);hitEnemy(e,o.dmg,{slow:true,stun:o.sp.stun,root:o.sp.root,kx:Math.cos(a)*o.sp.kb,ky:Math.sin(a)*o.sp.kb,c:'#5aaeff'});}});

}
function updPick(dt){
  const p=run.pl,st=run.st;
  for(let i=gems.length-1;i>=0;i--){
    const g=gems[i],d=dist(g,p);g.t+=dt;
    if(!g.mag&&d<st.magnet)g.mag=true;
    if(g.mag){const a=Math.atan2(p.y-g.y,p.x-g.x),s=Math.min(700,320+(g.sp=(g.sp||0)+dt*900));g.x+=Math.cos(a)*s*dt;g.y+=Math.sin(a)*s*dt;}
    if(d<p.r+12){run.xp+=g.v*st.xpm;sfx('gem',1+Math.min(.6,g.v/60));gems.splice(i,1);}
  }
  for(let i=picks.length-1;i>=0;i--){
    const k=picks[i],d=dist(k,p);k.t+=dt;
    if(k.k!=='chest'&&d<st.magnet*.7){const a=Math.atan2(p.y-k.y,p.x-k.x);k.x+=Math.cos(a)*300*dt;k.y+=Math.sin(a)*300*dt;}
    if(d<p.r+(k.k==='chest'?24:14)){
      if(k.k==='heal'){const h=st.maxhp*.15;p.hp=Math.min(st.maxhp,p.hp+h);floater(p.x,p.y-34,'+'+Math.round(h),'#8dff9e');sfx('pick');}
      else if(k.k==='magnet'){gems.forEach(g=>g.mag=true);toast('Ímã! Todos os pontos vêm até você.');sfx('pick');}
      else{P.st.chests++;run.pend+=k.big?2:1;run.chest=true;sfx('chest');checkAch();save();}
      picks.splice(i,1);

  }
}
function updFx(dt){
  for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=.94;q.vy*=.94;q.life-=dt;if(q.life<=0)parts.splice(i,1);}
  for(let i=floats.length-1;i>=0;i--){const f=floats[i];f.y-=36*dt;f.life-=dt;if(f.life<=0)floats.splice(i,1);}
  for(let i=fx.length-1;i>=0;i--){const f=fx[i];f.life-=dt;if(f.k==='ring')f.r=f.mx*(1-f.life/f.max);if(f.life<=0)fx.splice(i,1);}

function ownedPs(){return PS.filter(p=>run.pk[p.id]>0).length;}
function makeCards(){
  const pool=[];
  TYPES.forEach(t=>{const a=run.allies.find(x=>x.type===t);if(a){if(a.lvl<5)pool.push({k:'ally',t,w:4});}else if(run.allies.length<MAXALLY)pool.push({k:'ally',t,w:3});});
  PS.forEach(p=>{const n=run.pk[p.id];if(n>0){if(n<p.max)pool.push({k:'ps',id:p.id,w:4});}else if(ownedPs()<MAXPS)pool.push({k:'ps',id:p.id,w:3});});
  if(run.bl<5)pool.push({k:'basic',w:4});
  if(!pool.length){pool.push({k:'heal',w:1});pool.push({k:'ess',w:1});}
  const bag=[];pool.forEach(c=>{for(let i=0;i<c.w;i++)bag.push(c);});
  const out=[];let g=0;while(out.length<Math.min(3,pool.length)&&g++<300){const c=pick(bag);if(!out.includes(c))out.push(c);}
  return out;
}

function applyCard(c){
  if(c.k==='ally'){
    const a=run.allies.find(x=>x.type===c.t);
    if(a)a.lvl++;else{const n=mkAlly(c.t,1);n.x=run.pl.x;n.y=run.pl.y;run.allies.push(n);}

const TRC={};
function treeCanvas(b,v){
  const key=b+'_'+v;if(TRC[key])return TRC[key];
  const W=34,H=46,c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');
  const pal=[['#1f4d2b','#2f6b3a','#4a9a50','#8fd77f'],['#7a3a16','#a4501f','#d27a28','#f2c35c'],['#16403a','#1f5a50','#2f8a70','#7fd0b0'],['#2c2250','#4a3a7a','#6a56a0','#b29ae0']][b%4];
  const grid=[];for(let y=0;y<H;y++)grid.push(new Array(W).fill(null));
  const cx=17;
  for(let y=30;y<45;y++)for(let x=cx-2;x<=cx+2;x++)grid[y][x]=x<cx?'#5a3a22':x===cx?'#6e4a2c':'#43291a';
  for(let x=cx-4;x<=cx+4;x++)grid[44][x]='#43291a';
  const sh=(dx,dy,x,y)=>{const l=-(dx*.5+dy*.85)+(hash(x+v*7,y)-.5)*.5;return l>.5?pal[3]:l>.12?pal[2]:l>-.35?pal[1]:pal[0];};
  if(b===2){
    for(let i=0;i<4;i++){const ay=3+i*8,hw=5+i*3,hh=13;
      for(let y=ay;y<ay+hh&&y<34;y++){const w=(y-ay)/hh*hw+1;for(let x=Math.round(cx-w);x<=Math.round(cx+w);x++)grid[y][x]=sh((x-cx)/hw,(y-ay-hh/2)/hh*1.4,x,y);}}
  }else{
    const blobs=v?[[cx,13,12,11],[cx-9,21,8,7],[cx+9,21,8,7],[cx,25,11,6]]:[[cx,12,13,11],[cx-8,19,9,8],[cx+8,19,9,8],[cx,24,10,6]];
    for(let y=0;y<34;y++)for(let x=0;x<W;x++)for(const bl of blobs){const dx=(x+.5-bl[0])/bl[2],dy=(y+.5-bl[1])/bl[3];if(dx*dx+dy*dy<=1){grid[y][x]=sh(dx*.8+(x-cx)/40,dy+(y-14)/60,x,y);break;}}
    if(b===3){for(let i=0;i<5;i++){const x=cx-10+i*5,y=20+((i*7)%6);if(grid[y]&&grid[y][x])grid[y][x]=pal[3];}}
  }
  const edge=[];
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){if(grid[y][x])continue;if((y>0&&grid[y-1][x])||(y<H-1&&grid[y+1][x])||(x>0&&grid[y][x-1])||(x<W-1&&grid[y][x+1]))edge.push([x,y]);}
  edge.forEach(e=>{grid[e[1]][e[0]]='#10170f';});
  for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(grid[y][x]){g.fillStyle=grid[y][x];g.fillRect(x,y,1,1);}
  return TRC[key]=c;
}
